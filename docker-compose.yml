services:
  db:
    image: postgres:16-alpine
    container_name: black-sheep-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: black_sheep
    ports:
      - '5432:5432'
    volumes:
      - black-sheep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d black_sheep']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  black-sheep-pgdata:
